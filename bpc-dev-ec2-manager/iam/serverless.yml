service: bpc-dev-ec2-manager-role

provider:
  name: aws
  runtime: python3.12
  stage: ${self:custom.stage}
  region: ${self:custom.my-region}

custom:
  stage: ${opt:stage, 'dev'}
  my-region: ${opt:region, 'us-east-1'}
  config:
    dev:
      account_id: '130871271678'
    prod:
      account_id: '130871271678'

resources:
  - ${file(roles.yml)}
  - ${file(policies.yml)}
