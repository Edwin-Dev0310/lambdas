Resources:
  LambdaNotificationOverclockingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaNotificationOverclockingRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - Ref: LambdaNotificationOverclockingPolicy
