Resources:
  LambdaEC2ManagerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaEC2ManagerRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
