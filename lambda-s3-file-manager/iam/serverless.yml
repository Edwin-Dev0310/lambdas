service: mflores-fractal-s3-file-manager-role

provider:
  name: aws
  runtime: python3.12
  stage: ${self:custom.stage}
  region: ${self:custom.my-region}
  environment:
    REGION: ${self:provider.region}

custom:
  stage: ${opt:stage, 'dev'}
  my-region: ${opt:region, 'us-east-1'}
  config:
    prod:
      account_id: '857285351963'
      bucket_name: energrid-documents
    dev:
      account_id: '857285351963'
      bucket_name: energrid-documents

resources:
- ${file(roles.yml)}
- ${file(policies.yml)}
