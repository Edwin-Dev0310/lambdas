service: mflores-s3-extraction-gateway-role

provider:
  name: aws
  runtime: python3.12
  stage: ${self:custom.stage}
  region: ${self:custom.my-region}
  environment:
    REGION: ${self:provider.region}

custom:
  stage: ${opt:stage, 'dev'}
  my-region: ${opt:region, 'us-east-1'}
  config:
    dev:
      account_id: '857285351963'
      bucket_name: 'energrid-documents'
    prod:
      account_id: '857285351963'
      bucket_name: 'energrid-documents'

resources:
  - ${file(roles.yml)}
  - ${file(policies.yml)}
