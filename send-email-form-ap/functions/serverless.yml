service: mflores-send-form-ap-functions

provider:
  name: aws
  runtime: python3.12
  stage: ${self:custom.stage}
  region: ${self:custom.my-region}
  httpApi:
    cors: true
  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:custom.stage}
    SENDER_EMAIL: digital@ammperpower.com
    NOTIFICATION_EMAIL: info@ammper.com
    REPLY_EMAIL: digital@ammperpower.com
    
custom:
  stage: ${opt:stage, 'dev'}
  my-region: ${opt:region, 'us-west-1'}
  config:
    dev:
      my-region: us-west-1
      account_id: "625424230476"
      memory_size: 1024
    prd:
      my-region: us-west-1
      account_id: "625424230476"
      memory_size: 1024
  pythonRequirements:
    pythonBin: python3
    useDownloadCache: true
    useStaticCache: true
    cacheLocation: "../cache_python_requirements_plugin"
    staticCacheMaxVersions: 5
    fileName: requirements.txt

functions:
  sendEmailFormAP:
    handler: handler.send_email
    role: arn:aws:iam::${self:custom.config.dev.account_id}:role/LambdaSendEmailFormAPRole
    tags:
      dev: mflores
      project-name: form-ap
      env: ${self:custom.stage}
    events:
      - httpApi:
          path: /send-email-ap
          method: POST
